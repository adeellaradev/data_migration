services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15
  web:
    build: .
    ports:
      - "3001:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: 2lw0SqYuZ0S6IW9EOJISoI4a9D5UTPQs
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: j7BjNOcAYrOQy9F7eY4Sxirvl2PJjzvX
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: pGcfbKkCM3osiUky9q6A6uofAPFBaQaN
      DEMO_USER_PASSWORD: development-only-password
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/dev -b 0.0.0.0"
volumes:
  pgdata:
